[package]
name = "backhand-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.90.0"
description = "Binaries for the reading, creating, and modification of SquashFS file systems"
readme = "../README.md"

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap_complete = "4.6.9"
indicatif = "0.18.6"
console = "0.16.4"
rayon = "1.12.0"
backhand = { path = "../backhand", default-features = false, version = "0.25.1" }
tracing = "0.1.40"
color-print = "0.3.6"
clap-cargo = "0.19.0"

[lib]
bench = false

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies.jemallocator]
version = "0.5.4"

# These features mirror the backhand features
[features]
default = ["xz", "gzip", "zstd", "descriptive-errors"]
## Enables squashfs v3
v3 = ["backhand/v3"]
## Enables squashfs v3 with LZMA compression
v3_lzma = ["backhand/v3", "backhand/v3_lzma"]
## Enables squashfs v4 with adaptive LZMA compression
v4_lzma = ["backhand/v4_lzma"]
## Enables xz compression inside library and binaries
xz = ["backhand/xz"]
## Enables xz compression and forces static build inside library and binaries
xz-static = ["xz", "backhand/xz-static"]
## Enables gzip compression inside library and binaries
any-gzip = []
gzip = ["any-gzip", "backhand/gzip"]
## This library is licensed GPL and thus disabled by default
lzo = ["backhand/lzo"]
## Enables zstd compression inside library and binaries
zstd = ["backhand/zstd"]
lz4 = ["backhand/lz4"]
## Enable backhand parallel decompression
parallel = ["backhand/parallel"]
## Include deku descriptive parse-error strings for readable errors
descriptive-errors = ["backhand/descriptive-errors"]

[[bin]]
name = "unsquashfs-backhand"
path = "src/bin/unsquashfs.rs"
bench = false

[[bin]]
name = "add-backhand"
path = "src/bin/add.rs"
bench = false

[[bin]]
name = "replace-backhand"
path = "src/bin/replace.rs"
bench = false

[dev-dependencies]
test-assets-ureq = "0.6.2"
toml = "1.1"
