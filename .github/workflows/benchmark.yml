on: [pull_request]
name: CI Pull Request
jobs:
  benchmark-criterion:
    name: Benchmark (criterion)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: wcampbell0x2a/rust-bench-compare-action@0af46d10fda7311cff51d53b0a049d248b4dd0eb # v1.1.0
        with:
          harness: criterion
          benchName: benchmark
          branchName: ${{ github.base_ref }}
          before: "cargo build --bins --release --locked --workspace"
          token: ${{ secrets.GITHUB_TOKEN }}

  benchmark-gungraun:
    name: Benchmark (gungraun)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: gungraun/setup-gungraun@v1
      - uses: wcampbell0x2a/rust-bench-compare-action@0af46d10fda7311cff51d53b0a049d248b4dd0eb # v1.1.0
        with:
          harness: gungraun
          benchName: gungraun_benchmark
          branchName: ${{ github.base_ref }}
          before: "cargo build --bins --release --locked --workspace"
          token: ${{ secrets.GITHUB_TOKEN }}
