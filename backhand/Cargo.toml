[package]
name = "backhand"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.90"
description = "Library for the reading, creating, and modification of SquashFS file systems"
readme = "../README.md"

[package.metadata.docs.rs]
features = ["xz", "gzip", "zstd", "document-features", "v3", "v3_lzma", "v4_lzma"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
deku = { version = "0.20.1", default-features = false, features = ["std", "bits"] }
tracing = { version = "0.1.40", optional = true }
thiserror = "2.0.20"
flate2 = { version = "1.1.0", optional = true, default-features = false, features = ["zlib-rs"] }
liblzma = { version = "0.4.8", optional = true, default-features = false, features = ["static", "parallel"] }
liblzma-sys = { version = "0.4.8", optional = true, default-features = false, features = ["static"] }
lzma-adaptive-sys = { version = "0.1.0", optional = true }
lzma-rust2 = { version = "0.20.0", optional = true, features = ["xz", "encoder", "optimization"] }
rust-lzo = { version = "0.6.2", optional = true }
zstd = { version = "0.13.2", optional = true }
zstd-safe = { version = "7.2.1", optional = true }
document-features = { version = "0.2.10", optional = true }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
solana-nohash-hasher = "0.2.1"
lz4_flex = { version = "0.14.0", optional = true, default-features = false, features = ["alloc"] }
rayon = { version = "1.12.0", optional = true, default-features = false }
no_std_io2 = "0.9.4"

[features]
default = ["xz", "gzip", "zstd", "lz4", "parallel", "error-strings"]
## Enables squashfs v3
v3 = ["gzip"]
## Enables squashfs v3 with LZMA compression
v3_lzma = ["v3", "dep:lzma-adaptive-sys", "dep:lzma-rust2", "dep:liblzma"]
## Enables squashfs v4 with adaptive LZMA compression
v4_lzma = ["dep:lzma-adaptive-sys", "dep:lzma-rust2"]
## Enables xz compression inside library and binaries
xz = ["dep:liblzma", "dep:liblzma-sys"]
## Enables xz compression and forces static build inside library and binaries
xz-static = ["dep:liblzma", "dep:liblzma-sys", "liblzma?/static"]
## Enables gzip compression inside library and binaries using flate2 library with zlib-rs
gzip = ["any-gzip", "dep:flate2"]
## This library is licensed GPL and thus disabled by default
lzo = ["dep:rust-lzo"]
## Enables zstd compression inside library and binaries
zstd = ["dep:zstd", "dep:zstd-safe"]
## Enables Lz4 compression
lz4 = ["dep:lz4_flex"]
## Internal only
any-gzip = []
## Enable parallel decompression
parallel = ["dep:rayon"]
## Include deku descriptive parse-error strings.
descriptive-errors = ["deku/descriptive-errors"]
## Include this library's own error messages and log records. On by default.
## Turn it off to keep that text out of a compiled binary: error `Display` then
## prints nothing, and the log records are dropped.
error-strings = ["dep:tracing"]

[dev-dependencies]
test-log = { version = "0.2.21", features = ["trace"] }
test-assets-ureq = "0.6.2"
assert_cmd = { version = "2.2.2", features = ["color", "color-auto"] }
dir-diff = { git  = "https://github.com/wcampbell0x2a/dir-diff", branch = "add-checking-permissions" }
tempfile = "3.27.0"
criterion = "0.8"
libdeflater = "1.22.0"
toml = "1.1"
gungraun = "0.19.4"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "gungraun_benchmark"
harness = false

[lib]
bench = false
