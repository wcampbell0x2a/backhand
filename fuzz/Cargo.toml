[package]
name = "backhand-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { git = "https://github.com/AFLplusplus/LibAFL.git", rev = "bd1dda4818e1d3d67efe02bf48aa253a3f1fafb2", package = "libafl_libfuzzer" }

[dependencies.backhand]
path = "../backhand"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "bytes"
path = "fuzz_targets/bytes.rs"
test = false
doc = false

[[bin]]
name = "filesystem"
path = "fuzz_targets/filesystem.rs"
test = false
doc = false

[[bin]]
name = "raw"
path = "fuzz_targets/raw.rs"
test = false
doc = false

[[bin]]
name = "lzma"
path = "fuzz_targets/lzma.rs"
test = false
doc = false
required-features = ["v4_lzma"]

[features]
xz-static = ["backhand/xz-static"]
v4_lzma = ["backhand/v4_lzma"]
